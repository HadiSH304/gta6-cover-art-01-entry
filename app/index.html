<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Cover Studio — GTA-style cover art from your photos</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Leonida Cover Studio</h1>
    <p class="lede">Seven panels, one sunset grade — a Vice City poster in three steps.</p>

    <div class="group">
      <h2>1 · Photos &amp; captions</h2>
      <p class="hint">Click a panel, then pick its photo — or drag one onto
      the preview. Drag to pan, scroll to zoom.</p>
      <div id="panels"></div>
      <button id="loadSamples" type="button">Load the sample photos</button>
    </div>

    <div class="group">
      <h2>2 · Caption</h2>
      <div class="row">
        <label>Title <input id="title" type="text" maxlength="24" value="LEONIDA"></label>
        <label>Subtitle <input id="subtitle" type="text" maxlength="32" value="vice city nights"></label>
      </div>
      <label>Tagline bar <input id="tagline" type="text" maxlength="48" value="FIVE FRIENDS · ONE COAST · NO WAY BACK"></label>
      <div class="row">
        <label>Press quote <input id="quote" type="text" maxlength="40" value="PURE GOLDEN-HOUR MAYHEM"></label>
        <label>Quote source <input id="quoteSource" type="text" maxlength="32" value="THE HARBOR GAZETTE"></label>
      </div>
      <div id="presets" class="presets">
        <button type="button" data-preset="0">Leonida</button>
        <button type="button" data-preset="1">Keys to Paradise</button>
        <button type="button" data-preset="2">Ocean Beach</button>
        <button type="button" data-preset="3">Sunset Heist</button>
        <button type="button" data-preset="4">Grassrivers</button>
        <button type="button" data-preset="5">Starfish Island</button>
      </div>
    </div>

    <div class="group">
      <h2>3 · Poster devices</h2>
      <div class="row">
        <label>Gold seal, line 1 <input id="seal1" type="text" maxlength="12" value="ORIGINAL"></label>
        <label>line 2 <input id="seal2" type="text" maxlength="12" value="COVER ART"></label>
      </div>
      <label>Billing block <input id="billing" type="text" maxlength="110" value="A SUNSET PICTURES PRODUCTION · STARRING YOU · SHOT ON YOUR OWN CAMERA · GRADED BY HAND"></label>
      <div class="row">
        <label>Volume ticket <input id="volume" type="text" maxlength="10" value="VOL. 1"></label>
        <label>Corner line <input id="comingSoon" type="text" maxlength="16" value="COMING SOON"></label>
      </div>
      <label class="check"><input id="showSeal" type="checkbox" checked> Show gold seal &amp; barcode</label>
    </div>

    <div class="group">
      <h2>4 · Grade, layout &amp; export</h2>
      <div id="grades" class="choices">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="poster">Poster</button>
        <button type="button" data-grade="neon">Neon Nights</button>
      </div>
      <label>Layout
        <select id="layout">
          <option value="collage" selected>Vice collage (hero + stacks)</option>
          <option value="grid">Poster grid (3 × 2)</option>
        </select>
      </label>
      <div id="sizes" class="choices">
        <button type="button" data-size="1920x1080" class="active">1920 × 1080</button>
        <button type="button" data-size="1080x1080">1080 × 1080</button>
        <button type="button" data-size="1080x1350">1080 × 1350</button>
      </div>
      <button id="export" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="preview" aria-label="Live cover preview">
    <canvas id="cover" width="960" height="540" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
